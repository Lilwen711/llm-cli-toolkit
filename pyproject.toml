[project]
name = "llm-cli-toolkit"
version = "0.1.0"   
description = "电商售后助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llm-cli = "llm_cli.main:main"

[build-system]
requires = ["uv_build>=0.11.23"]

build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
