[project]
name = "llm-cli-toolkit"
version = "0.1.0"   
description = "电商售后助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.27.8",
    "openai>=3.35.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llm-cli = "llm_cli.main:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_cli"
